name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Or use go-version-file: 'go.mod'
          go-version-file: 'go.mod'

      - name: Build binaries
        run: |
          echo "Building for Linux (amd64, arm64)"
          GOOS=linux GOARCH=amd64 go build -o certwarden-do-lb-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -o certwarden-do-lb-linux-arm64 main.go
          
          echo "Building for macOS (amd64, arm64)"
          GOOS=darwin GOARCH=amd64 go build -o certwarden-do-lb-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -o certwarden-do-lb-darwin-arm64 main.go
          
          echo "Building for Windows (amd64)"
          GOOS=windows GOARCH=amd64 go build -o certwarden-do-lb-windows-amd64.exe main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            certwarden-do-lb-linux-amd64
            certwarden-do-lb-linux-arm64
            certwarden-do-lb-darwin-amd64
            certwarden-do-lb-darwin-arm64
            certwarden-do-lb-windows-amd64.exe
